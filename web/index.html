    <script>
      // Set the appearance before first paint so there's no flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
