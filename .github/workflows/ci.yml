name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check dataset is present and valid
        run: node -e "const d=require('./data/cars.json'); if(!d.cars.length) throw new Error('no cars'); console.log(d.cars.length+' cars')"
