<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Australia Cars API</title>
  <meta name="description" content="Browse cars sold in Australia since 2000, with pictures and colour options. Powered by a read-only JSON API.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Australia Cars API</h1>
      <p class="sub" id="stats">Loading…</p>
    </div>
    <a class="api-link" href="/api/meta">API</a>
  </header>

  <form class="filters" id="filters" autocomplete="off">
    <input type="search" id="q" placeholder="Search make, model, generation…" aria-label="Search">
    <select id="make" aria-label="Make"><option value="">All makes</option></select>
    <select id="body" aria-label="Body type"><option value="">All body types</option></select>
    <input type="number" id="year" placeholder="Year" min="2000" max="2100" aria-label="Year">
    <select id="sort" aria-label="Sort">
      <option value="make">Make A–Z</option>
      <option value="-year">Newest first</option>
      <option value="year">Oldest first</option>
      <option value="model">Model A–Z</option>
    </select>
  </form>

  <p class="count" id="count" aria-live="polite"></p>
  <main class="grid" id="grid"></main>

  <nav class="pager" id="pager">
    <button id="prev" type="button">← Previous</button>
    <span id="pageinfo"></span>
    <button id="next" type="button">Next →</button>
  </nav>

  <dialog id="detail" aria-labelledby="detail-title">
    <button class="close" id="close" type="button" aria-label="Close">×</button>
    <div id="detail-body"></div>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
